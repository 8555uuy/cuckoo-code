<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件预览</title>
  <style>
    :root {
      --bg: #ffffff; --text: #1f2329; --dim: #8a9099;
      --border: #e5e7eb; --surface: #f5f6f8; --primary: #4d6bfe;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181d; --text: #e6e8eb; --dim: #7c828c;
        --border: #2a2d34; --surface: #1e2128; --primary: #6b83ff; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .size { font-size: 11px; color: var(--dim); flex-shrink: 0; }
    .spacer { flex: 1; }
    button { font-family: inherit; font-size: 12px; padding: 6px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
    button:hover { background: var(--surface); }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .body { flex: 1; overflow: auto; }
    pre { margin: 0; padding: 14px 16px; font-family: "Consolas", "Courier New", monospace;
      font-size: 12.5px; line-height: 1.6; white-space: pre; tab-size: 2; }
    .hint { padding: 40px; text-align: center; color: var(--dim); font-size: 13px; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="name" id="fp-name">文件预览</span>
    <span class="size" id="fp-size"></span>
    <span class="spacer"></span>
    <button id="fp-open" title="用系统默认程序打开">用系统程序打开</button>
    <button id="fp-close" class="primary" title="关闭预览">关闭</button>
  </div>
  <div class="body" id="fp-body">
    <div class="hint">在左侧文件树中点击文件查看内容</div>
  </div>
  <script>
    var API = window.fileAPI || {};
    var curPath = null;
    var nameEl = document.getElementById("fp-name");
    var sizeEl = document.getElementById("fp-size");
    var bodyEl = document.getElementById("fp-body");
    function fmtSize(n) {
      if (typeof n !== "number") return "";
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / 1024 / 1024).toFixed(2) + " MB";
    }
    function showHint(text) {
      bodyEl.innerHTML = "";
      var d = document.createElement("div");
      d.className = "hint";
      d.textContent = text;
      bodyEl.appendChild(d);
    }
    async function showFile(relPath) {
      curPath = relPath;
      nameEl.textContent = relPath;
      nameEl.title = relPath;
      sizeEl.textContent = "";
      showHint("加载中…");
      try {
        var r = await API.read(relPath);
        if (!r || !r.success) { showHint((r && r.error) || "读取失败"); return; }
        sizeEl.textContent = fmtSize(r.size);
        bodyEl.innerHTML = "";
        var pre = document.createElement("pre");
        pre.textContent = r.content;
        bodyEl.appendChild(pre);
      } catch (err) {
        showHint("读取失败: " + (err && err.message));
      }
    }
    document.getElementById("fp-close").addEventListener("click", function () {
      if (API.close) API.close();
    });
    document.getElementById("fp-open").addEventListener("click", function () {
      if (curPath && API.openExternal) API.openExternal(curPath);
    });
    if (API.onShow) API.onShow(function (payload) {
      if (payload && payload.relPath) showFile(payload.relPath);
    });
    if (API.ready) API.ready();
  </script>
</body>
</html>
